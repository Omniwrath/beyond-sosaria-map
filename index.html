<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond Sosaria Map</title>
<meta name="description" content="Every world of Beyond Sosaria: teleporters with their own art, where each creature has been seen, NPCs, regions and open housing plots.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Cinzel:wght@600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* One world, drawn in the client's own colours: the page stays dark around it in every theme, so the map is the light. */
:root {
  --ground: #0f1517; --panel: #162023; --panel-edge: #2a3a3e; --ink: #e6ecea; --muted: #93a5a4; --title: #f0d78c;
  --accent: #56b3bd; --bad: #ef6b5b; --good: #4fd28a; --pick: #f3d424;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink);
  font: 400 15px/1.45 "Source Sans 3", system-ui, sans-serif; }
body { display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--panel-edge); }
h1 { margin: 0; font: 600 19px/1.1 Cinzel, Georgia, serif; color: var(--title); letter-spacing: .03em; white-space: nowrap; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab { border: 1px solid var(--panel-edge); background: transparent; color: var(--muted); padding: 4px 10px;
  border-radius: 4px; font: 600 13px/1.2 inherit; font-family: inherit; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab[aria-pressed="true"] { color: var(--ground); background: var(--title); border-color: var(--title); }
.tab:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.find { position: relative; flex: 1 1 260px; max-width: 420px; }
.find input { width: 100%; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--panel-edge); background: var(--ground);
  color: var(--ink); font: inherit; }
#results { position: absolute; z-index: 1000; left: 0; right: 0; top: calc(100% + 4px); max-height: 55vh; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.hit { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; padding: 7px 12px; border: 0;
  border-bottom: 1px solid var(--panel-edge); background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
.hit:last-child { border-bottom: 0; }
.hit:hover, .hit:focus-visible { background: #1b2427; outline: none; }
.hit .k { flex: none; width: 58px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.hit .k.creature { color: var(--bad); }
.hit .k.npc { color: var(--title); }
.hit .w { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.empty { margin: 0; padding: 8px 12px; color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 14px; color: var(--muted); }
.tools label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
.tools select, .coords input { background: var(--ground); color: var(--ink); border: 1px solid var(--panel-edge); border-radius: 4px;
  font: inherit; padding: 3px 6px; }
.coords { display: inline-flex; gap: 4px; align-items: center; }
.coords input { width: 64px; font-variant-numeric: tabular-nums; }
.coords button { background: transparent; color: var(--ink); border: 1px solid var(--panel-edge); border-radius: 4px; padding: 3px 9px;
  font: inherit; cursor: pointer; }
#note { padding: 0 16px; min-height: 0; color: var(--muted); font-size: 14px; }
#note:not(:empty) { padding: 6px 16px; border-bottom: 1px solid var(--panel-edge); background: var(--panel); }
#map { flex: 1; min-height: 320px; background: #000; }
#map .leaflet-tile { image-rendering: pixelated; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink); box-shadow: 0 6px 18px rgba(0,0,0,.6); }
.leaflet-popup-content { margin: 10px 14px; font: 400 14px/1.4 "Source Sans 3", system-ui, sans-serif; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.pop .t { font-weight: 700; color: var(--title); }
.pop .s { color: var(--muted); font-size: 13px; }
.pop .s.where { color: var(--ink); }
.pop .s.lib { margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--panel-edge); color: var(--ink); }
.pop .lk { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--title); }
.readout { background: rgba(15, 21, 23, .85); color: var(--ink); padding: 3px 8px; border-radius: 4px; font: 600 13px/1.3 system-ui, sans-serif;
  font-variant-numeric: tabular-nums; }
.tp { font: 700 13px/14px system-ui, sans-serif; text-align: center; text-shadow: 0 0 2px #000, 0 0 2px #000; color: #9aa3ad;
  background: rgba(0, 0, 0, .55); border-radius: 50%; }
.tpArt { filter: drop-shadow(0 0 2px #000); cursor: pointer; }
.tpDot { border-radius: 50%; background: #c084fc; border: 1px solid #1a1030; }
.seen { width: 14px; height: 14px; border-radius: 50%; background: var(--bad); border: 2px solid #fff; box-shadow: 0 0 6px rgba(239, 107, 91, .9); }
footer { padding: 6px 16px; font-size: 12px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--panel-edge);
  display: flex; flex-wrap: wrap; gap: 4px 16px; }
footer a { color: var(--accent); }
@media (max-width: 640px) {
  header { padding: 8px 12px; gap: 8px; }
  .coords { display: none; }
  #note:not(:empty) { padding: 6px 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Beyond Sosaria Map</h1>
  <div class="tabs" id="tabs" role="group" aria-label="World"></div>
  <div class="find">
    <input id="q" type="search" placeholder="Find a town, dungeon, NPC or creature" autocomplete="off" aria-label="Search the map">
    <div id="results" hidden></div>
  </div>
  <div class="tools">
    <label><input type="checkbox" id="layerTp" checked> Teleporters</label>
    <label>Housing plots
      <select id="layerHouse" aria-label="Housing plot size">
        <option value="0">off</option><option value="7">7x7</option><option value="11">11x11</option>
        <option value="18">18x18</option><option value="24">24x24</option><option value="31">31x31</option>
      </select></label>
    <form class="coords" id="coords"><input id="cx" inputmode="numeric" placeholder="x" aria-label="x">
      <input id="cy" inputmode="numeric" placeholder="y" aria-label="y"><button type="submit">Go</button></form>
  </div>
</header>
<div id="note" role="status"></div>
<div id="map"></div>
<footer><span>Map data as of 2026-10-28 -- refreshed nightly.</span>
  <span>Teleporters, sightings and NPCs are what one player's characters have walked through and seen; the art is the game's own.</span></footer>
<script>
"use strict";
const ORDER = [1, 2, 3, 4, 5, 101];          // Felucca is not shown (the exporter leaves it out)
const ART_ZOOM = -2;
const st = {map: null, worlds: {}, world: 1, tiles: null, groups: {}, portals: [], regions: [], npcs: [], creatures: [],
            housing: [], library: [], seen: null, cache: {}};
const $ = id => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function note(t) { $("note").textContent = t || ""; }
function worldName(m) { const w = st.worlds[String(m)]; return w ? (w.world === "TerMur" ? "Ter Mur" : w.world) : String(m); }
async function load(name) {
  if (!st.cache[name]) st.cache[name] = fetch("data/" + name).then(r => { if (!r.ok) throw new Error(name); return r.json(); });
  return st.cache[name];
}
function regionsAt(m, x, y) {
  const hits = [];
  for (const r of st.regions) {
    if (r.map !== m) continue;
    const b = r.boxes.find(([x1, y1, x2, y2]) => x1 <= x && x <= x2 && y1 <= y && y <= y2);
    if (b) hits.push([(b[2] - b[0]) * (b[3] - b[1]), r.name]);
  }
  return hits.sort((a, b) => a[0] - b[0]).map(h => h[1]);
}
function libraryAt(m, x, y) {
  return st.library.filter(b => b.map === m && b.sq[0] <= x && x < b.sq[0] + b.sq[2] && b.sq[1] <= y && y < b.sq[1] + b.sq[2]);
}
// THE RUNE TO RECALL TO: [gate, book, slot] -> "gate 1, page 4, (792, 2366, 0)" -- the library rune nearest by walk
function runeLine(r) {
  const b = st.libBook && st.libBook[`${r[0]},${r[1]}`];
  const q = b && b.runes.find(q => q[0] === r[2]);
  if (!q) return "";
  return `gate ${b.gate}, ${b.page ? `page ${b.page}, ` : ""}${q[4] || `(${q[1]}, ${q[2]}, ${q[3]})`}` +
    (b.page ? "" : " (its book is not in the gate yet)");
}
function popup(x, y, title, lines, r) {
  const box = el("div", "pop");
  box.append(el("div", "t", title));
  for (const t of lines) if (t) box.append(el("div", "s", t));
  const where = regionsAt(st.world, x, y).slice(0, 3);
  if (where.length) box.append(el("div", "s where", "In " + where.join(" · ")));
  // THE LIBRARY ON THE MAP: the Rune Library book(s) whose square holds this spot -- its gate and title, as the
  // Moongate Library lists them
  const books = libraryAt(st.world, x, y);
  const near = r ? runeLine(r) : "";
  if (near) {
    const lib = el("div", "s lib");
    lib.append(el("span", "lk", "Rune Library"), " " + near);
    box.append(lib);
  } else if (books.length) {
    const lib = el("div", "s lib");
    lib.append(el("span", "lk", "Rune Library"), " " + books.map(b => `gate ${b.gate}${b.page ? `, page ${b.page}` : ""}, “${b.title}”` +
      (b.marked < b.n ? ` (${b.marked} of ${b.n} runes in so far)` : "")).join(" · "));
    box.append(lib);
  }
  L.popup({maxWidth: 320}).setLatLng([y + .5, x + .5]).setContent(box).openOn(st.map);
}
function setWorld(m, view) {
  const w = st.worlds[String(m)];
  if (!w) return;
  const changed = m !== st.world || !st.tiles;
  st.world = m;
  for (const b of $("tabs").children) b.setAttribute("aria-pressed", String(Number(b.dataset.m) === m));
  if (changed) {
    if (st.tiles) st.map.removeLayer(st.tiles);
    st.tiles = L.tileLayer(`tiles/${w.tiles}/{z}/{x}_{y}.png`, {tileSize: w.tile || 256, minZoom: -5, maxZoom: 3,
      minNativeZoom: w.min_zoom, maxNativeZoom: w.max_zoom, noWrap: true, bounds: [[0, 0], [w.h, w.w]], keepBuffer: 3})
      .addTo(st.map);
    st.tiles.bringToBack();
    st.map.setMaxBounds([[-w.h * .2, -w.w * .2], [w.h * 1.2, w.w * 1.2]]);
    st.groups.pick.clearLayers();
    st.map.closePopup();
  }
  if (view === "fit") {
    const width = $("map").clientWidth || 1000;
    st.map.setView([w.h / 2, w.w / 2], Math.max(w.min_zoom, Math.min(0, Math.floor(Math.log2(width / w.w)))), {animate: false});
  }
  drawAreas(); drawTeleporters(); drawHousing(); drawSeen();
}
// THE PLACES DRAWN WHOLE: a place drawn as the game draws it, laid flat on its own ground; its moongates by their own
// art on their own tiles, sized as every teleporter's is. A click goes through to the map's own.
function drawAreas() {
  const g = st.groups.area; g.clearLayers();
  const far = st.map.getZoom() < ART_ZOOM;
  for (const a of st.areas || []) {
    if (Number(a.map) !== st.world) continue;
    const [x0, y0, x1, y1] = a.box;
    L.imageOverlay(a.top, [[y0, x0], [y1 + 1, x1 + 1]], {interactive: false}).addTo(g);
    if (far) continue;
    for (const q of a.gates || []) {
      const s = Math.min(1, 34 / Math.max(q.w, q.h));
      const w = Math.max(8, Math.round(q.w * s)), h = Math.max(8, Math.round(q.h * s));
      L.marker([q.y + .5, q.x + .5], {icon: L.icon({iconUrl: "art/" + q.file, iconSize: [w, h], iconAnchor: [w / 2, h / 2],
                                                     className: "tpArt"}), keyboard: false, interactive: false}).addTo(g);
    }
  }
}
function drawTeleporters() {
  const g = st.groups.tp; g.clearLayers();
  if (!$("layerTp").checked) return;
  const icons = {};
  const unknown = L.divIcon({className: "tp", html: "?", iconSize: [14, 14], iconAnchor: [7, 7]});
  // THE ART WHEN IT CAN BE SEEN: zoomed far out the pictures pile on each other -- a small dot each until zoom ART_ZOOM
  const far = st.map.getZoom() < ART_ZOOM;
  const dot = L.divIcon({className: "tpDot", iconSize: [7, 7], iconAnchor: [3.5, 3.5]});
  for (const p of st.portals) {
    if (Number(p.map) !== st.world) continue;
    let icon = far ? dot : unknown;
    if (p.art && !far) {
      if (!icons[p.art.file]) {
        const s = Math.min(1, 34 / Math.max(p.art.w || 34, p.art.h || 34));
        const w = Math.max(8, Math.round((p.art.w || 26) * s)), h = Math.max(8, Math.round((p.art.h || 26) * s));
        icons[p.art.file] = L.icon({iconUrl: "art/" + p.art.file, iconSize: [w, h], iconAnchor: [w / 2, h / 2], className: "tpArt"});
      }
      icon = icons[p.art.file];
    }
    const x = Number(p.x), y = Number(p.y), z = v => (v === "" || v == null ? "" : ` (z ${v})`);
    const kind = p.way === "network" ? "Public moongate" : (p.use || "").startsWith("say") ? "Speak to use"
      : (p.use || "").startsWith("dclick") ? "Double-click to use" : "Step on";
    L.marker([y + .5, x + .5], {icon, keyboard: false}).on("click", ev => {
      L.DomEvent.stopPropagation(ev);
      popup(x, y, p.name || kind, [kind + (p.art && p.art.what ? " · " + p.art.what : ""),
        `${worldName(p.map)} ${x}, ${y}${z(p.z)} → ${worldName(p.map2)} ${p.x2}, ${p.y2}${z(p.z2)}${p.way === "both" ? " (both ways)" : ""}`,
        p.cond ? "Needs: " + p.cond : "", p.use && p.use !== "step" ? "Use: " + p.use : ""]);
    }).addTo(g);
  }
}
function drawHousing() {
  const g = st.groups.house; g.clearLayers();
  const want = parseInt($("layerHouse").value, 10) || 0;
  if (!want) return;
  let n = 0;
  for (const s of st.housing) {
    if (s.map !== st.world || s.side < want + 1) continue;
    n++;
    L.rectangle([[s.y, s.x], [s.y + s.side, s.x + s.side]], {color: "#4fd28a", weight: 1, fillOpacity: .18}).on("click", ev => {
      L.DomEvent.stopPropagation(ev);
      popup(s.cx, s.cy, `Fits a ${want}x${want} plot`, [`${worldName(s.map)} ${s.cx}, ${s.cy} · flat ${s.side}x${s.side} at height ${s.z}`,
        `Room for up to ${s.plot_w}x${s.plot_h}`, s.noble ? "Ter Mur asks the Queen's nobility" : "",
        "Open when this map was made -- someone may have built there since"]);
    }).addTo(g);
  }
  note(`${n} open plot${n === 1 ? "" : "s"} for a ${want}x${want} in ${worldName(st.world)}.`);
}
function drawSeen() {
  const g = st.groups.seen; g.clearLayers();
  const e = st.seen;
  if (!e) return;
  const icon = L.divIcon({className: "", html: '<div class="seen"></div>', iconSize: [14, 14], iconAnchor: [7, 7]});
  for (const p of e.places) {
    if (p.map !== st.world) continue;
    L.marker([p.y + .5, p.x + .5], {icon, keyboard: false, title: e.name}).on("click", ev => {
      L.DomEvent.stopPropagation(ev);
      popup(p.x, p.y, e.name, [`${worldName(p.map)} ${p.x}, ${p.y}`, `${p.seen} seen around here`], p.r);
    }).addTo(g);
  }
}
async function showCreature(c) {
  let places;
  try { places = await load("sightings/" + c.kind + ".json"); } catch (e) { note("Those sightings did not load."); return; }
  st.seen = {name: c.name, places};
  if (!places.some(p => p.map === st.world)) setWorld(places[0].map, null);
  drawSeen();
  const here = places.filter(p => p.map === st.world);
  st.map.fitBounds(here.map(p => [p.y, p.x]), {padding: [40, 40], maxZoom: -1, animate: false});
  const worlds = [...new Set(places.map(p => worldName(p.map)))];
  note(`${c.name}: seen at ${places.length} place${places.length === 1 ? "" : "s"}` +
       (worlds.length > 1 ? ` across ${worlds.join(", ")} -- showing ${worldName(st.world)}` : "") + ". Clear the search to hide them.");
}
function goTo(m, x, y, title, r) {
  if (m !== st.world) setWorld(m, null);
  st.map.setView([y, x], Math.max(st.map.getZoom(), -1), {animate: false});
  st.groups.pick.clearLayers();
  L.circleMarker([y + .5, x + .5], {radius: 6, color: "#f3d424", weight: 2, fill: false}).addTo(st.groups.pick);
  popup(x, y, title || `${worldName(m)} ${x}, ${y}`, title ? [`${worldName(m)} ${x}, ${y}`] : [], r);
}
function search(q) {
  const box = $("results");
  q = (q || "").trim().toLowerCase();
  if (q.length < 2) {
    box.hidden = true; box.replaceChildren();
    if (!q && st.seen) { st.seen = null; drawSeen(); note(""); }
    return;
  }
  const rank = n => [n.toLowerCase().startsWith(q) ? 0 : 1, n.length];
  const by = (a, b) => { const ra = rank(a.name), rb = rank(b.name); return ra[0] - rb[0] || ra[1] - rb[1]; };
  const out = [];
  const places = st.regions.filter(r => r.name.toLowerCase().includes(q)).sort(by).slice(0, 8);
  for (const r of places) {
    const [x1, y1, x2, y2] = r.boxes.reduce((a, b) => ((b[2] - b[0]) * (b[3] - b[1]) > (a[2] - a[0]) * (a[3] - a[1]) ? b : a));
    out.push({k: "place", name: r.name, w: `${worldName(r.map)}`, go: () => goTo(r.map, (x1 + x2) >> 1, (y1 + y2) >> 1, r.name)});
  }
  for (const n of st.npcs.filter(n => n.name.toLowerCase().includes(q)).sort(by).slice(0, 8)) {
    out.push({k: "npc", name: n.name, w: `${worldName(n.map)} ${n.x}, ${n.y}`, go: () => goTo(n.map, n.x, n.y, n.name, n.r)});
  }
  for (const c of st.creatures.filter(c => c.name.includes(q)).sort(by).slice(0, 8)) {
    out.push({k: "creature", name: c.name, w: `${c.places} place${c.places === 1 ? "" : "s"}`, go: () => showCreature(c)});
  }
  box.hidden = false;
  if (!out.length) { box.replaceChildren(el("p", "empty", "Nothing by that name.")); return; }
  box.replaceChildren(...out.map(r => {
    const b = el("button", "hit"); b.type = "button";
    b.append(el("span", "k " + r.k, r.k), el("span", "", r.name), el("span", "w", r.w));
    b.onclick = () => { box.hidden = true; r.go(); };
    return b;
  }));
}
// A LINK TO A PLACE: the address keeps the world, the spot and the zoom (#world/x/y/zoom), so a link opens where it was made
function writeHash() {
  if (!st.map) return;
  const c = st.map.getCenter();
  history.replaceState(null, "", `#${st.world}/${Math.floor(c.lng)}/${Math.floor(c.lat)}/${st.map.getZoom()}`);
}
function readHash() {
  const m = location.hash.match(/^#(\d+)\/(\d+)\/(\d+)\/(-?\d+)$/);
  return m ? {world: +m[1], x: +m[2], y: +m[3], z: +m[4]} : null;
}
async function init() {
  if (typeof L === "undefined") { note("The map library did not load -- check the internet connection and reload."); return; }
  try {
    [st.worlds, st.portals, st.regions, st.npcs, st.creatures, st.housing, st.library] = await Promise.all(
      ["worlds.json", "portals.json", "regions.json", "npcs.json", "sightings.json", "housing.json", "library.json"].map(load));
    st.areas = await load("areas.json").catch(() => []);     // the places drawn whole -- none before the first build with them
  } catch (e) { note("The map's data did not load. Reload the page."); return; }
  st.libBook = {};
  for (const b of st.library) st.libBook[`${b.gate},${b.book}`] = b;
  const crs = L.extend({}, L.CRS.Simple, {transformation: new L.Transformation(1, 0, 1, 0)});
  st.map = L.map("map", {crs, minZoom: -5, maxZoom: 3, zoomSnap: 1, attributionControl: false, preferCanvas: true});
  for (const k of ["area", "house", "tp", "seen", "pick"]) st.groups[k] = L.layerGroup().addTo(st.map);
  const Readout = L.Control.extend({onAdd() { return L.DomUtil.create("div", "readout"); }});
  const readout = new Readout({position: "bottomleft"}).addTo(st.map);
  st.map.on("mousemove", e => { readout.getContainer().textContent = `${worldName(st.world)} ${Math.floor(e.latlng.lng)}, ${Math.floor(e.latlng.lat)}`; });
  st.map.on("click", e => {
    const x = Math.floor(e.latlng.lng), y = Math.floor(e.latlng.lat), w = st.worlds[String(st.world)];
    if (w && x >= 0 && y >= 0 && x < w.w && y < w.h) goTo(st.world, x, y, null);   // never a spot off the world's edge
  });
  st.map.on("moveend", writeHash);
  let lastFar = null;
  st.map.on("zoomend", () => { const far = st.map.getZoom() < ART_ZOOM; if (far !== lastFar) { lastFar = far; drawTeleporters(); drawAreas(); } });
  for (const m of ORDER) {
    if (!st.worlds[String(m)]) continue;
    const b = el("button", "tab", worldName(m)); b.type = "button"; b.dataset.m = m;
    b.onclick = () => { setWorld(m, "fit"); writeHash(); };
    $("tabs").append(b);
  }
  $("layerTp").onchange = drawTeleporters;
  $("layerHouse").onchange = () => { if (!(parseInt($("layerHouse").value, 10) || 0)) note(""); drawHousing(); };
  let typing = 0;
  $("q").oninput = ev => { clearTimeout(typing); typing = setTimeout(() => search(ev.target.value), 200); };
  $("q").onkeydown = ev => { if (ev.key === "Escape") { ev.target.value = ""; search(""); } };
  $("coords").onsubmit = ev => {
    ev.preventDefault();
    const x = parseInt($("cx").value, 10), y = parseInt($("cy").value, 10);
    if (Number.isFinite(x) && Number.isFinite(y)) goTo(st.world, x, y, null);
  };
  const jump = () => {
    const h = readHash();
    if (!h || !st.worlds[String(h.world)]) return false;
    setWorld(h.world, null);
    st.map.setView([h.y, h.x], h.z, {animate: false});
    return true;
  };
  if (!jump()) setWorld(1, "fit");
  window.addEventListener("hashchange", jump);      // a link pasted into an open map goes there too
}
init();
</script>
</body>
</html>
